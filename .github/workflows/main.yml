name: Python CI with Conda

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Conda environment
      # This action sets up a Conda environment in the GitHub Actions runner.
      uses: conda-incubator/setup-miniconda@v3
      with:
        python-version: "3.10" # Or your desired Python version
        environment-file: environment.yml # We'll create this in the next step
        auto-activate-base: false # Don't activate the base environment
        use-mamba: true # Use mamba for faster and more reliable dependency solving

    - name: Activate Conda environment
      # The shell command needs to be preceded with '-l' to properly activate Conda.
      shell: bash -l {0}
      run: |
        conda activate mcq-env

    - name: Install dependencies from requirements.txt
      # Install dependencies from your requirements.txt file within the Conda environment.
      shell: bash -l {0}
      run: |
        conda activate mcq-env
        pip install -r requirements.txt

    - name: Run tests (optional)
      # If you have a test script (e.g., in a Python file), you can run it here.
      # Replace `python my_test_file.py` with your actual test command.
      shell: bash -l {0}
      run: |
        conda activate mcq-env
        echo "Running automated tests..."
        # python my_test_file.py

    - name: Display environment information
      shell: bash -l {0}
      run: |
        conda activate mcq-env
        python --version
        pip list
